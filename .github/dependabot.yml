---
# Set update schedule for GitHub Actions

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    # Check for updates every day
    schedule:
      interval: "daily"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    assignees:
      - "mullholland"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    # Look for Dockerfiles in the `Dockerfiles` directory
    directory: "/Dockerfiles"
    # Check for updates every day
    schedule:
      interval: "daily"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    assignees:
      - "mullholland"
